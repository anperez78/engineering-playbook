[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-service"
version = "0.1.0"
description = "Python DDD service starter"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "mypy>=1.11,<2.0", "pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests requiring infrastructure or adapters", "e2e: end-to-end tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
