name: Playbook CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m json.tool .claude-plugin/marketplace.json
      - run: python -m json.tool plugins/engineering-playbook/.claude-plugin/plugin.json
      - run: python -m json.tool managed/manifest.json
      - run: python -m pytest scripts/test_sync_playbook.py
